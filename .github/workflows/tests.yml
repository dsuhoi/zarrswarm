name: Tests

on:
  push:
    paths:
      - zarrswarm/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - zarrswarm/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.23
      - name: Install locked dependencies
        run: uv sync --frozen --extra test --extra netcdf
      - name: Check package entry points
        run: |
          .venv/bin/python -c "import zarrswarm; assert zarrswarm.open_dataset.__module__ == 'zarrswarm.store'"
          .venv/bin/python -m zarrswarm --help
          .venv/bin/zarrswarm --help
      - name: Run tests
        run: .venv/bin/python -m pytest -q tests
      - name: Build distribution
        run: uv build
      - name: Check installed wheel outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          uv run --no-project --python 3.12 --with "$GITHUB_WORKSPACE"/dist/*.whl python -c "import zarrswarm; from importlib.metadata import distribution; assert zarrswarm.open_dataset.__module__ == 'zarrswarm.store'; expected = {'zarrswarm': 'zarrswarm.cli:main', 'zarrswarm-tui': 'zarrswarm.tui:main', 'zt': 'zarrswarm.cli:main', 'zt-tui': 'zarrswarm.tui:main'}; assert {e.name: e.value for e in distribution('zarrswarm').entry_points} == expected"
          uv run --no-project --python 3.12 --with "$GITHUB_WORKSPACE"/dist/*.whl zarrswarm --help
