site_name: ZarrSwarm
site_description: Verified peer-to-peer sharing of Zarr arrays with xarray integration.
site_url: !ENV [DOCS_SITE_URL, "https://dsuhoi.github.io/zarrswarm/"]
repo_url: https://github.com/dsuhoi/zarrswarm
repo_name: dsuhoi/zarrswarm
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy

plugins:
  - search:
      lang: [en]

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - User guide and xarray: user.md
      - Running nodes: operator.md
      - Network and trust: network.md
      - Configuration: config.md
      - Source contracts: source-contracts.md
  - Experiments: experiments.md
  - Publishing documentation: publishing.md

exclude_docs: |
  /requirements.txt

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
