[project]
name = "zarrswarm"
version = "0.1.0"
description = "Verified peer-to-peer sharing of Zarr arrays with xarray integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["zarr>=3", "xarray", "numpy", "aiohttp>=3.9", "textual", "cryptography"]

[project.optional-dependencies]
test = ["pytest", "dask"]
netcdf = ["h5netcdf", "h5py"]

[project.scripts]
zarrswarm = "zarrswarm.cli:main"
zarrswarm-tui = "zarrswarm.tui:main"
zs = "zarrswarm.cli:main"
zs-tui = "zarrswarm.tui:main"
zt = "zarrswarm.cli:main"
zt-tui = "zarrswarm.tui:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zarrswarm"]

[project.urls]
Repository = "https://github.com/dsuhoi/zarrswarm"
Documentation = "https://dsuhoi.github.io/zarrswarm/"
Issues = "https://github.com/dsuhoi/zarrswarm/issues"
